name: clinica-cumpito

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: clinica-cumpito:${IMAGE_TAG:-latest}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &app-environment
    APP_NAME: ${APP_NAME:-VitalTrack Pediátrico}
    APP_ENV: production
    APP_KEY: ${APP_KEY:?La clave APP_KEY es obligatoria}
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:?La URL pública de la aplicación es obligatoria}
    APP_LOCALE: es
    APP_FALLBACK_LOCALE: es
    APP_FAKER_LOCALE: es_ES
    APP_TIMEZONE: America/La_Paz
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-error}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-vitaltrack}
    DB_USERNAME: ${DB_USERNAME:-vitaltrack}
    DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    DB_SSLMODE: disable
    SESSION_DRIVER: database
    SESSION_ENCRYPT: "true"
    SESSION_SECURE_COOKIE: "true"
    CACHE_STORE: database
    FILESYSTEM_DISK: local
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_SCHEME: ${MAIL_SCHEME:-null}
    MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
    MAIL_PORT: ${MAIL_PORT:-2525}
    MAIL_USERNAME: ${MAIL_USERNAME:-null}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-VitalTrack Pediátrico}
  volumes:
    - app_storage:/var/www/html/storage
  networks:
    - internal
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      RUN_LARAVEL_SETUP: "true"
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1/up >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vitaltrack}
      POSTGRES_USER: ${DB_USERNAME:-vitaltrack}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  internal:
    driver: bridge

volumes:
  app_storage:
  postgres_data:
