<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente - PediApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="max-w-4xl mx-auto p-6">
        <!-- Encabezado -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-teal-700">Nuevo Paciente</h1>
                <p class="text-gray-500 text-sm">Ingrese los datos base para iniciar el historial.</p>
            </div>
            <a href="index.html" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 inline-block transition">
                <i class="fas fa-arrow-left mr-2"></i> Volver
            </a>
        </div>

        <form action="#" class="space-y-6">

            <!-- 1. Datos de Filiación -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-teal-600 mb-4 border-b pb-2">1. Datos de Filiación</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                        <input type="text" placeholder="Ej: Aitana Aguilar"
                            class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento</label>
                        <input type="date"
                            class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sexo</label>
                        <select
                            class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border">
                            <option>Femenino</option>
                            <option>Masculino</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 2. Datos de Nacimiento (La Línea Base) -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-teal-600 mb-4 border-b pb-2">2. Datos al Nacer (Histórico)</h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso al nacer (kg)</label>
                        <div class="relative">
                            <input type="number" step="0.01" placeholder="Ej: 3.200"
                                class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border pl-8">
                            <span class="absolute left-3 top-2 text-gray-400"><i class="fas fa-weight"></i></span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Talla al nacer (cm)</label>
                        <div class="relative">
                            <input type="number" step="0.1" placeholder="Ej: 50"
                                class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border pl-8">
                            <span class="absolute left-3 top-2 text-gray-400"><i
                                    class="fas fa-ruler-vertical"></i></span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Perímetro Cefálico (cm)</label>
                        <div class="relative">
                            <input type="number" step="0.1" placeholder="Ej: 34"
                                class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border pl-8">
                            <span class="absolute left-3 top-2 text-gray-400"><i class="fas fa-circle-notch"></i></span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Parto</label>
                        <select
                            class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border">
                            <option>Parto Normal</option>
                            <option>Cesárea</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Lugar de Nacimiento</label>
                        <input type="text" placeholder="Clínica / Hospital"
                            class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border">
                    </div>
                </div>
            </div>

            <!-- 3. Antecedentes y Laboratorios Iniciales (Checklist) -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-teal-600 mb-4 border-b pb-2">3. Antecedentes y Screening</h2>

                <!-- Laboratorios Neonatales -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-teal-50 p-3 rounded-lg border border-teal-100">
                        <label class="block text-xs font-bold text-teal-800 uppercase mb-1">Grupo Sanguíneo</label>
                        <input type="text" placeholder="Ej: O+"
                            class="w-full bg-white border-gray-300 rounded shadow-sm text-sm p-1 border">
                    </div>
                    <div class="flex items-center p-3 border rounded-lg hover:bg-gray-50">
                        <input type="checkbox" id="chagas"
                            class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
                        <label for="chagas" class="ml-2 block text-sm text-gray-900 font-medium">Chagas Positivo</label>
                    </div>
                    <div class="flex items-center p-3 border rounded-lg hover:bg-gray-50">
                        <input type="checkbox" id="sifilis"
                            class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 rounded">
                        <label for="sifilis" class="ml-2 block text-sm text-gray-900 font-medium">Sífilis
                            Positivo</label>
                    </div>
                </div>

                <!-- Text Areas -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Antecedentes Alérgicos</label>
                        <textarea rows="2"
                            class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border"
                            placeholder="Medicamentos, alimentos..."></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Antecedentes Patológicos</label>
                            <textarea rows="2"
                                class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Antecedentes Quirúrgicos</label>
                            <textarea rows="2"
                                class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-teal-500 focus:border-teal-500 p-2 border"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="flex justify-end space-x-4 pt-4">
                <button type="button"
                    class="px-6 py-3 border border-gray-300 shadow-sm text-base font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    Guardar y Salir
                </button>
                <button type="submit"
                    class="px-6 py-3 border border-transparent shadow-sm text-base font-medium rounded-md text-white bg-teal-600 hover:bg-teal-700">
                    Guardar e Iniciar Consulta
                </button>
            </div>

        </form>
    </div>

</body>

</html>
