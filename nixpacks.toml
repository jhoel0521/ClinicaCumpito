# Nixpacks Configuration for Static HTML Site

# 1. Fase de Instalación: Instalamos Caddy (Servidor Web)
[phases.setup]
nixPkgs = ["caddy"]

# 2. Fase de Construcción: No necesitamos compilar nada porque es HTML estático
[phases.build]
cmds = []

# 3. Fase de Inicio: Servimos los archivos en el puerto 80 (o el que asigne Coolify con $PORT)
# 'file-server' activa el modo estático.
# '--root .' indica que sirva la carpeta actual.
# '--listen :80' escucha en el puerto estándar.
[start]
cmd = "caddy file-server --root . --listen :80"