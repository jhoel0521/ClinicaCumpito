# Ajustes de Apache (Alpine) para internet móvil lento (EDGE/3G por hotspot).
# Se incluye desde /etc/apache2/conf.d/, después de httpd.conf y del vhost.

# El httpd.conf de Alpine no carga todos los módulos: se cargan solo si faltan.
<IfModule !deflate_module>
    LoadModule deflate_module modules/mod_deflate.so
</IfModule>
<IfModule !filter_module>
    LoadModule filter_module modules/mod_filter.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !reqtimeout_module>
    LoadModule reqtimeout_module modules/mod_reqtimeout.so
</IfModule>

# Subidas de varios MB pueden tardar minutos: no cortar la conexión (ni el
# proxy hacia PHP-FPM) al minuto, ni exigir 500 bytes/s con señal débil.
Timeout 900
<IfModule proxy_module>
    ProxyTimeout 900
</IfModule>

<IfModule reqtimeout_module>
    RequestReadTimeout header=20-60,MinRate=100 body=60,MinRate=100
</IfModule>

# Compresión: HTML, CSS, JS y las respuestas JSON de Livewire (/livewire/update).
<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/javascript
    AddOutputFilterByType DEFLATE application/javascript application/json application/xml image/svg+xml
</IfModule>

# Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre.
<IfModule headers_module>
    <LocationMatch "^/build/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/images/">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>
</IfModule>
